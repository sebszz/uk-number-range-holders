<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK Phone Number Lookup</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rubik', sans-serif;
            max-width: 600px;
            margin: 0 auto;
            background-color: #192640;
            color:#ddd;
            font-size: 16px;
        }
        .container {
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        /* Tab Styles */
        .tab-buttons {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #3b4c6f;
        }
        .tab-button {
            padding: 10px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 13px;
            color: #ddd;
            border-bottom: 2px solid transparent;
            transition: color 0.3s, border-color 0.3s;
        }
        .tab-button.active, .tab-button:hover {
            background-color: #3b4c6f;
            font-weight: bold;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        input[type="text"] {
            width: calc(100% - 20px);
            padding: 10px;
            border: #3b4c6f 1px solid;
            background-color: #3b4c6f;
            border-radius: 4px;
            color: #ddd;
            margin-bottom:10px;
        }
        button {
            width: 100%;
            padding: 10px 20px;
            background-color: #16d041;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #11b938;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background-color: #3b4c6f;
            border-radius: 4px;
        }
        #result a {
            color: #a6bdd4;
            text-decoration: underline;
        }
        #result a:hover {
            text-decoration: underline;
        }
        h4 {
            margin-bottom: 5px;
        }
        h1 {
            margin-top:0;
        }
        p {
            margin-top: 0;
        }
        select {
            width: 100%;
            padding: 10px;
            border: #3b4c6f 1px solid;
            background-color: #3b4c6f;
            color: #ddd;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 8px;
            text-align: left;
            border: 1px solid #3b4c6f;
            font-size: 0.8rem;
            
        }
        tr:hover {
            background-color: #3b4c6f;
        }
        th {
            background-color: #3b4c6f;
            font-weight: 500;
        }
        .summary {
            margin-bottom: 15px;
            font-weight: 500;
        }
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 2s linear infinite;
            margin: 20px auto;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @media screen and (min-width:600px) {
            body {
                padding: 20px;
            }
            .container {
                border-radius: 8px;
                border: 1px solid #3b4c6f;
                background-color: #1f2d4a;
            }
            .tab-button {
                font-size: 16px;
            }
            input[type="text"] {
                width: 70%;
                margin-right: 10px;
            }
            button {
                width: auto;
            }
            th, td {
                font-size: 1rem;
            }
            h1 {
            margin-top:20px;
        }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>UK Phone Number Information</h1>
        
        <div class="tab-buttons">
            <button class="tab-button active" onclick="switchTab('number-lookup')">Number lookup</button>
            <button class="tab-button" onclick="switchTab('provider-lookup')">Provider lookup</button>
            <button class="tab-button" onclick="switchTab('top-providers')">Top 30 providers</button>
        </div>

        <div id="number-lookup" class="tab-content active">
            <p>Enter a UK phone number <i>e.g. 01603112345</i> to find its provider.</p>
            <input type="text" id="phoneInput" placeholder="Enter phone number">
            <button onclick="getPhoneInfo()">Get Info</button>
            <div id="result" style="display:none;"></div>
        </div>

        <div id="provider-lookup" class="tab-content">
            <p>Select a provider to see their number ranges:</p>
            <select id="providerSelect">
                <option value="">Select a provider...</option>
            </select>
            <div id="loading" class="loading-spinner"></div>
            <div id="rangesTable"></div>
        </div>

        <div id="top-providers" class="tab-content">
            <p>List of top 30 providers based on number ranges owned:</p>
            <div id="topProvidersTable"></div>
        </div>
    </div>

    <script>
        let providers = {};
        let areaMap = {};
        let uniqueProviders = [];
        let topProviders = [];

        function switchTab(tabName) {
            // Hide all tab contents
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(content => content.classList.remove('active'));
            
            // Remove active from all buttons
            const buttons = document.querySelectorAll('.tab-button');
            buttons.forEach(button => button.classList.remove('active'));
            
            // Show selected tab
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            // If switching to top providers, show the table
            if (tabName === 'top-providers') {
                showTopProviders();
            }
        }

        async function loadProvidersForTab() {
            try {
                providers = await loadJsonLocalOrRemote('./numberProviders.json', 'https://raw.githubusercontent.com/sebszz/uk-number-range-holders/refs/heads/main/numberProviders.json');
                const areaData = await loadJsonLocalOrRemote('./areaCodes.json', 'https://raw.githubusercontent.com/sebszz/uk-number-range-holders/refs/heads/main/areaCodes.json');
                areaMap = {};
                for (let k in areaData) {
                    areaMap[k.substring(1)] = areaData[k]; // Remove '+' to get '442890'
                }
                populateProviderDropdown();
                computeTopProviders();
            } catch (e) {
                document.getElementById('rangesTable').innerHTML = '<p>Error loading provider data.</p>';
                document.getElementById('topProvidersTable').innerHTML = '<p>Error loading provider data.</p>';
            }
        }

        function populateProviderDropdown() {
            uniqueProviders = [...new Set(Object.values(providers))].sort();
            const select = document.getElementById('providerSelect');
            uniqueProviders.forEach(provider => {
                const option = document.createElement('option');
                option.value = provider;
                option.textContent = provider;
                select.appendChild(option);
            });
            select.onchange = showProviderRanges;
        }

        function computeTopProviders() {
            const providerStats = {};
            Object.keys(providers).forEach(key => {
                const prov = providers[key];
                if (!providerStats[prov]) {
                    providerStats[prov] = { ranges: 0, totalNumbers: 0 };
                }
                const L = key.length;
                const size = Math.pow(10, 12 - L);
                providerStats[prov].ranges++;
                providerStats[prov].totalNumbers += size;
            });

            topProviders = Object.entries(providerStats)
                .map(([prov, stats]) => ({ provider: prov, ...stats }))
                .sort((a, b) => b.ranges - a.ranges)
                .slice(0, 30);
        }

        function showTopProviders() {
            const tableDiv = document.getElementById('topProvidersTable');
            if (topProviders.length === 0) {
                tableDiv.innerHTML = '<p>Loading data...</p>';
                return;
            }
            let tableHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Provider</th>
                            <th>Ranges owned</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            topProviders.forEach((item, index) => {
                tableHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${item.provider}</td>
                        <td>${item.ranges.toLocaleString()}</td>
                    </tr>
                `;
            });
            tableHTML += '</tbody></table>';
            tableDiv.innerHTML = tableHTML;
        }

        function getAreaForRange(rangeKey) {
            let bestAreaKey = '';
            let bestALength = 0;
            for (let key in areaMap) {
                if (rangeKey.startsWith(key) && key.length > bestALength) {
                    bestALength = key.length;
                    bestAreaKey = key;
                }
            }
            return bestAreaKey ? areaMap[bestAreaKey] : 'Non-geographic';
        }

        function showProviderRanges() {
            const selectedProvider = document.getElementById('providerSelect').value;
            const tableDiv = document.getElementById('rangesTable');
            const loadingDiv = document.getElementById('loading');
            if (!selectedProvider) {
                tableDiv.innerHTML = '';
                loadingDiv.style.display = 'none';
                return;
            }

            // Show loading spinner
            loadingDiv.style.display = 'block';
            tableDiv.innerHTML = '';

            // Use setTimeout to allow UI to update before heavy processing
            setTimeout(() => {
                const ranges = Object.keys(providers).filter(key => providers[key] === selectedProvider).sort();
                let totalNumbers = 0;
                let areaCounts = {};
                ranges.forEach(range => {
                    const L = range.length;
                    const size = Math.pow(10, 12 - L);
                    totalNumbers += size;
                    const area = getAreaForRange(range);
                    if (!areaCounts[area]) areaCounts[area] = 0;
                    areaCounts[area]++;
                });
                let sortedAreas = Object.entries(areaCounts).sort(([,a], [,b]) => b - a);
                let topArea = sortedAreas[0] ? sortedAreas[0][0] : '';
                let topCount = sortedAreas[0] ? sortedAreas[0][1] : 0;
                let secondArea = sortedAreas[1] ? sortedAreas[1][0] : '';
                let secondCount = sortedAreas[1] ? sortedAreas[1][1] : 0;
                let displayTop = topArea === 'Unknown' ? 'Non-geographic' : topArea;
                let summary = `The selected provider, ${selectedProvider}, owns ${ranges.length} number ranges. This means they own ${totalNumbers.toLocaleString()} numbers in total (please note, this number might be invalid due to many numbers being ported away to different providers). The most popular area code they own is ${displayTop}, they own ${topCount} of those ranges.`;
                if (secondCount > 1) {
                    let displaySecond = secondArea === 'Unknown' ? 'Non-geographic' : secondArea;
                }
                summary = `<div class="summary">${summary}</div>`;
                let tableHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>Number Range</th>
                                <th>Area code</th>
                                <th>Provider</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                ranges.forEach(range => {
                    const L = range.length;
                    const numXs = 12 - L;
                    const xs = 'X'.repeat(numXs);
                    const formattedRange = '0' + range.substring(2) + xs;
                    const area = getAreaForRange(range);
                    tableHTML += `
                        <tr>
                            <td>${formattedRange}</td>
                            <td>${area}</td>
                            <td>${selectedProvider}</td>
                        </tr>
                    `;
                });
                tableHTML += '</tbody></table>';
                tableDiv.innerHTML = summary + tableHTML;

                // Hide loading spinner
                loadingDiv.style.display = 'none';
            }, 0);
        }

        function getRelativeTime(updateDateStr) {
            const [day, month, year] = updateDateStr.split('/').map(Number);
            const updateDate = new Date(year, month - 1, day);
            const now = new Date();
            const diffInMs = now - updateDate;
            if (diffInMs < 0) return 'in the future';
            const diffInDays = Math.floor(diffInMs / (1000 * 60 * 60 * 24));
            if (diffInDays === 0) return 'today';
            if (diffInDays < 30) return `${diffInDays} day${diffInDays > 1 ? 's' : ''} ago`;
            const months = Math.floor(diffInDays / 30.4375);
            if (months < 12) {
                const remainingDays = Math.floor(diffInDays % 30.4375);
                if (remainingDays === 0) {
                    return `${months} month${months > 1 ? 's' : ''} ago`;
                }
                return `${months} month${months > 1 ? 's' : ''} and ${remainingDays} day${remainingDays > 1 ? 's' : ''} ago`;
            }
            const years = Math.floor(diffInDays / 365.25);
            const remainingDaysAfterYears = diffInDays % 365.25;
            const remMonths = Math.floor(remainingDaysAfterYears / 30.4375);
            const remDays = Math.floor(remainingDaysAfterYears % 30.4375);
            let str = `${years} year${years > 1 ? 's' : ''}`;
            if (remMonths > 0) {
                str += `, ${remMonths} month${remMonths > 1 ? 's' : ''}`;
            }
            if (remDays > 0) {
                if (remMonths > 0) {
                    str += ' and ';
                } else {
                    str += ', ';
                }
                str += `${remDays} day${remDays > 1 ? 's' : ''}`;
            }
            str += ' ago';
            return str;
        }

        async function loadJsonLocalOrRemote(localPath, remoteUrl) {
            const filename = localPath.split('/').pop();

            if (location.protocol === 'file:') {
                console.log(`Running from file://, using remote ${filename}`);
                const response = await fetch(remoteUrl);
                if (!response.ok) {
                    throw new Error('Remote fetch failed');
                }
                return await response.json();
            }

            try {
                const response = await fetch(localPath);
                if (!response.ok) {
                    throw new Error('Local file not found');
                }
                console.log(`Using local ${filename}`);
                return await response.json();
            } catch (e) {
                console.log(`Local ${filename} not found, using remote`);
                const response = await fetch(remoteUrl);
                if (!response.ok) {
                    throw new Error('Remote fetch failed');
                }
                return await response.json();
            }
        }

        async function getPhoneInfo() {
            const input = document.getElementById('phoneInput');
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            const numStr = input.value.replace(/\D/g, ''); // Extract digits only

            if (numStr.length < 10) {
                resultDiv.textContent = 'Please enter a valid UK phone number.';
                return;
            }

            let normalized;
            if (numStr.startsWith('44')) {
                normalized = numStr;
            } else if (numStr.startsWith('0')) {
                normalized = '44' + numStr.substring(1);
            } else {
                resultDiv.textContent = 'Invalid UK phone number format.';
                return;
            }

            if (!normalized.startsWith('44')) {
                resultDiv.textContent = 'Invalid UK phone number.';
                return;
            }

            const displayNum = '0' + normalized.substring(2);

            // Fetch providers if not loaded
            if (Object.keys(providers).length === 0) {
                try {
                    providers = await loadJsonLocalOrRemote('./numberProviders.json', 'https://raw.githubusercontent.com/sebszz/uk-number-range-holders/refs/heads/main/numberProviders.json');
                } catch (e) {
                    resultDiv.textContent = 'Error fetching provider data.';
                    return;
                }
            }

            // Fetch area codes if not loaded
            if (Object.keys(areaMap).length === 0) {
                try {
                    const areaData = await loadJsonLocalOrRemote('./areaCodes.json', 'https://raw.githubusercontent.com/sebszz/uk-number-range-holders/refs/heads/main/areaCodes.json');
                    areaMap = {};
                    for (let k in areaData) {
                        areaMap[k.substring(1)] = areaData[k]; // Remove '+' to get '442890'
                    }
                } catch (e) {
                    resultDiv.textContent = 'Error fetching area code data.';
                    return;
                }
            }

            // Find best provider match (longest prefix)
            let bestProviderKey = '';
            let bestPLength = 0;
            for (let key in providers) {
                if (normalized.startsWith(key) && key.length > bestPLength) {
                    bestPLength = key.length;
                    bestProviderKey = key;
                }
            }
            const providerName = bestProviderKey ? providers[bestProviderKey] : 'Unknown';
            const L = bestProviderKey ? bestProviderKey.length : 0;
            const numXs = L ? 12 - L : 5;
            const rangeStr = bestProviderKey ? '0' + bestProviderKey.substring(2) + 'X'.repeat(numXs) : 'Unknown';

            // Determine city/location
            let cityName;
            if (normalized.startsWith('447')) {
                cityName = 'UK mobile number, so no location is assigned';
            } else {
                // Find best area match (longest prefix)
                let bestAreaKey = '';
                let bestALength = 0;
                for (let key in areaMap) {
                    if (normalized.startsWith(key) && key.length > bestALength) {
                        bestALength = key.length;
                        bestAreaKey = key;
                    }
                }
                cityName = bestAreaKey ? areaMap[bestAreaKey] : 'Non-geographic';
            }

            // Construct location sentence
            const locationSentence = cityName.startsWith('UK mobile') 
                ? `This is a ${cityName}.` 
                : `This number is a ${cityName} area-code number.`;

            // Construct provider part conditionally
            let providerPart = `Number range holder is ${providerName}.`;
            if (providerName !== 'Unknown') {
                providerPart += ` They own the range ${rangeStr}.`;
            }

            // Date and relative time
            const updateDateStr = '15/10/2025';
            const relativeTime = getRelativeTime(updateDateStr);

            // Construct result with hyperlink
            const result = `${providerPart} ${locationSentence} <br/><br/>Please note, the last update of number range holders has been updated on ${updateDateStr} (${relativeTime}). For the most up to date results go to <a href="https://www.ofcom.org.uk/phones-and-broadband/phone-numbers/numbering-data" target="_blank">Ofcom website</a>. <h4>Number is ported?</h4>It's possible that ${displayNum} may have been ported to another provider. Number porting information is not publically available.`;

            // Additional link
            const phonelyLink = `https://www.phonely.co.uk/who-called-me/${displayNum}`;
            const additionalLink = `<h4>Check for reports</h4><p><a href="${phonelyLink}" target="_blank">Click here</a> to check if there are any online reports about calls from ${displayNum}.</p>`;

            resultDiv.innerHTML = result + additionalLink;
        }

        // Preload providers on page load to populate dropdown immediately
        document.addEventListener('DOMContentLoaded', () => {
            loadProvidersForTab();
        });
    </script>
</body>
</html>
